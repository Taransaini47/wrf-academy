<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.03" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)" />
  <rect width="1280" height="800" fill="url(#grid)" />
  
  <!-- Ambient glowing orbs -->
  <circle cx="200" cy="200" r="300" fill="#818cf8" opacity="0.15" filter="blur(80px)" />
  <circle cx="1080" cy="600" r="400" fill="#38bdf8" opacity="0.1" filter="blur(100px)" />
  <circle cx="640" cy="400" r="250" fill="#c084fc" opacity="0.1" filter="blur(80px)" />
  
  <!-- Content Group -->
  <g transform="translate(0, -20)">
    <!-- Subtitle -->
    <text x="640" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="-0.5">
      Thanks for visiting us
    </text>
    
    <!-- Main Title -->
    <text x="640" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-3" filter="url(#glow)">
      WRF Academy
    </text>
    
    <!-- Decorative Line -->
    <rect x="540" y="560" width="200" height="4" rx="2" fill="url(#textGrad)" opacity="0.5" />
  </g>
</svg>
